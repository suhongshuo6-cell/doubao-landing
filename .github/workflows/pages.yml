# GitHub Pages 自动发布
#
# 本项目是免构建的纯静态站，所以这里不做任何构建，直接把仓库根目录上传为 Pages 制品。
# 如果你的仓库是用户主页仓库（<user>.github.io），也可以改用
# Settings → Pages → Deploy from a branch → main / (root)，无需本 workflow。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
